<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PubliChef Pro — L'Athélia</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #1e1e1e;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.5);
        }
        h1 {
            text-align: center;
            color: #fff;
            font-size: 24px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #aaa;
        }
        input[type="file"], select, textarea {
            width: 100%;
            padding: 12px;
            background: #2d2d2d;
            border: 1px solid #3d3d3d;
            border-radius: 8px;
            color: #fff;
            box-sizing: border-box;
            font-size: 16px;
        }
        textarea {
            resize: vertical;
            min-height: 150px;
            font-family: inherit;
            line-height: 1.5;
        }
        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .btn-success {
            background-color: #28a745;
            color: white;
            margin-top: 15px;
        }
        .btn-success:hover {
            background-color: #218838;
        }
        .btn-download {
            background-color: #ffc107;
            color: #121212;
            text-align: center;
            text-decoration: none;
            display: block;
            box-sizing: border-box;
        }
        .btn-download:hover {
            background-color: #e0a800;
        }
        #result-section {
            margin-top: 30px;
            border-top: 2px solid #2d2d2d;
            padding-top: 25px;
            display: none;
        }
        .preview-img {
            max-width: 100%;
            border-radius: 12px;
            display: block;
            margin: 0 auto 20px auto;
            box-shadow: 0 2px 15px rgba(0,0,0,0.4);
            /* Force l'iPhone à ouvrir le menu natif "Enregistrer l'image" sur appui long */
            -webkit-touch-callout: default !important;
        }
        .loading {
            display: none;
            text-align: center;
            font-style: italic;
            color: #007bff;
            margin: 20px 0;
            font-weight: bold;
        }
        .status-msg {
            text-align: center;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>👨‍🍳 PubliChef — L'Athélia</h1>

    <div id="setup-section">
        <div class="form-group">
            <label for="dish-file">📸 Photo du plat (depuis ton iPhone) :</label>
            <input type="file" id="dish-file" accept="image/*">
        </div>

        <div class="form-group">
            <label for="decor-select">🖼️ Choisir l'ambiance de fond :</label>
            <select id="decor-select">
                <option value="salle">🛋️ Table de la Salle Intérieure</option>
                <option value="terrasse">☀️ Table de la Terrasse Outdoor</option>
            </select>
        </div>

        <button class="btn-primary" id="btn-generate">✨ Sublimer & Générer le Post</button>
    </div>

    <div class="loading" id="loading-spinner">⏳ Traitement Culinaire Actif & Création IA en cours (RAM optimisée)...</div>

    <div id="result-section">
        <label>🖼️ Ton Plat Sublimé (Appui long pour enregistrer directement) :</label>
        <img id="result-img" class="preview-img" src="" alt="Plat finalisé">

        <div class="form-group">
            <a id="btn-download-action" class="button btn-download" href="#" download="plat_publichef.jpg" style="padding: 15px; border-radius: 8px; font-weight: bold; font-size: 16px; display: block; text-align: center;">
                💾 Enregistrer dans la pellicule / PC
            </a>
        </div>

        <div class="form-group" style="margin-top: 25px;">
            <label for="caption-text">📝 Légende automatique unifiée (FB & Insta) :</label>
            <textarea id="caption-text"></textarea>
        </div>

        <button class="btn-success" id="btn-publish">🚀 Publier sur la Page (Facebook ➔ Instagram)</button>
        <div class="status-msg" id="status-display"></div>
    </div>
</div>

<script>
    let currentImageBase64 = null;

    document.getElementById("btn-generate").addEventListener("click", async () => {
        const fileInput = document.getElementById("dish-file");
        const decorSelect = document.getElementById("decor-select");
        
        if (!fileInput.files || fileInput.files.length === 0) {
            alert("S'il te plaît, sélectionne d'abord une photo de ton plat !");
            return;
        }

        const formData = new FormData();
        formData.append("dish", fileInput.files[0]);
        formData.append("decor", decorSelect.value);

        document.getElementById("loading-spinner").style.display = "block";
        document.getElementById("result-section").style.style = "none";
        document.getElementById("status-display").innerText = "";

        try {
            const response = await fetch("/generate_v2", {
                method: "POST",
                body: formData
            });
            const data = await response.json();

            if (data.error) {
                alert("Erreur serveur : " + data.error);
                return;
            }

            // Affichage de l'image finale
            currentImageBase64 = data.image;
            document.getElementById("result-img").src = currentImageBase64;

            // Activation du bouton de téléchargement direct
            const downloadBtn = document.getElementById("btn-download-action");
            downloadBtn.href = currentImageBase64;

            // Remplissage de la légende unifiée (Texte + Tel + Tags)
            document.getElementById("caption-text").value = data.facebook;

            // Affichage du bloc résultat
            document.getElementById("result-section").style.display = "block";
            document.getElementById("result-section").scrollIntoView({ behavior: 'smooth' });

        } catch (err) {
            alert("Erreur de connexion avec Render : " + err.message);
        } finally {
            document.getElementById("loading-spinner").style.display = "none";
        }
    });

    document.getElementById("btn-publish").addEventListener("click", async () => {
        const captionText = document.getElementById("caption-text").value;
        const statusDisplay = document.getElementById("status-display");

        statusDisplay.style.color = "#007bff";
        statusDisplay.innerText = "🚀 Envoi en cours à Meta (Facebook + duplication Instagram)...";

        try {
            const response = await fetch("/publish_to_socials", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    caption_fb: captionText,
                    facebook: true // Forcé à true pour valider la route simplifiée
                })
            });
            const data = await response.json();

            if (data.success) {
                statusDisplay.style.color = "#28a745";
                statusDisplay.innerText = "🎉 " + data.message;
            } else {
                statusDisplay.style.color = "#dc3545";
                statusDisplay.innerText = "❌ Erreur : " + data.error;
            }
        } catch (err) {
            statusDisplay.style.color = "#dc3545";
            statusDisplay.innerText = "❌ Erreur réseau : " + err.message;
        }
    });
</script>

</body>
</html>
